<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Online Food Ordering System</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            background-image: url('your-background-image.jpg'); /* Replace with your image path */
            background-size: cover;
            background-position: center;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-form {
            background: rgba(255, 255, 255, 0.9); /* White background with some transparency */
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            width: 300px;
            text-align: center;
        }

        .login-form h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .login-form input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .login-form button {
            width: 100%;
            padding: 10px;
            background-color: #FF5722; /* A food-related color */
            color: black; /* Font color set to black */
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .login-form button:hover {
            background-color: #E64A19; /* Darker shade on hover */
        }

        .message {
            margin-top: 15px;
            color: #FF5722; /* Message color */
        }

        .login-form p {
            margin-top: 15px;
            color: #555;
        }

        .login-form a {
            color: #333; /* Link color */
            text-decoration: none;
        }

        .login-form a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <form class="login-form" id="loginForm">
            <h2>Login to Order Food</h2>
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
            <p>Don't have an account? <a href="signup.html">Sign Up</a> </p>
            <p><a href="index.html">Back to Home</a></p>
            <div class="message" id="message"></div>
        </form>
    </div>

    <script>
        // Handle form submission
        document.getElementById('loginForm').onsubmit = function(event) {
            event.preventDefault(); // Prevent the default form submission
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            // Simulate checking if the user is already logged in
            // In a real application, you would check this with your backend
            const isLoggedIn = false; // Change this to true to simulate a logged-in user

            if (isLoggedIn) {
                messageDiv.innerHTML = "You are already logged in!";
            } else {
                // Here you would typically send the username and password to your server for validation
                // For demonstration, we'll just show a message
                if (username && password) {
                    messageDiv.innerHTML = "No account found. Please sign up.";
                } else {
                    messageDiv.innerHTML = "Please enter your username and password.";
                }
            }
        };
    </script>
</body>
</html>
